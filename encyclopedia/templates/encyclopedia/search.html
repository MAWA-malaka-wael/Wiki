<!DOCTYPE html>
<html>
<head>
    <title>Search Results</title>
    <link rel="stylesheet" href="/static/encyclopedia/styles.css">
</head>
<body>
    <h1>Search Results for "{{ query }}"</h1>
    <ul>
    {% for result in results %}
        <li><a href="/wiki/{{ result }}">{{ result }}</a></li>
    {% endfor %}
    </ul>
    {% if not results %}
        <p>No results found.</p>
    {% endif %}
</body>
</html>
